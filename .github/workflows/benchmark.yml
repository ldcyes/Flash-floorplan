name: Flash-flooplanner RTL validation
on:
  push:
    branches: [benchmark/openroad-validation]
    paths: ['benchmarks/**', '.github/workflows/benchmark.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flash-benchmark-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      BENCH_MODE: full
      ORFS_REF: a16fb344899f51d75bee31ad18650a2aa91d8c53
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: tool-cache
          key: openroad-a008522d8-ubuntu2204
      - name: Install pinned OpenROAD and public Nangate45 library
        run: bash benchmarks/install_tools.sh
      - name: Run synthesis, placement, global routing, and metrics
        run: python3 benchmarks/run.py
      - name: Upload unfiltered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flash-validation-${{ github.run_number }}
          path: |
            benchmark-results
            platform
            benchmarks
          retention-days: 30
