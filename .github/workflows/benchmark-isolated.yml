name: Flash physical validation - isolated cases
on:
  push:
    branches: [benchmark/openroad-isolated]
    paths: ['benchmarks/**', '.github/workflows/benchmark-isolated.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flash-isolated-${{ github.ref }}
  cancel-in-progress: true
jobs:
  case:
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        family: [crossbar, benes, router]
        shape: ['4,8', '8,8', '4,16', '8,16', '16,8', '16,16']
    env:
      BENCH_MODE: full
      BENCH_FAMILY: ${{ matrix.family }}
      BENCH_SHAPE: ${{ matrix.shape }}
      ORFS_REF: a16fb344899f51d75bee31ad18650a2aa91d8c53
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: tool-cache
          key: openroad-a008522d8-ubuntu2204
      - name: Install recorded toolchain
        run: bash benchmarks/install_tools.sh
      - name: Execute unchanged case protocol with independent watchdog
        run: |
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('benchmarks/run.py')
          s=p.read_text()
          marker="BUDGETS=["
          assert s.count(marker)==1
          s=s.replace(marker,"CONFIGS=[tuple(map(int,os.environ['BENCH_SHAPE'].split(',')))]\n"+marker)
          s=s.replace("for kind in plan['families']:","for kind in [os.environ['BENCH_FAMILY']]:")
          s=s.replace("if (ROOT/'benchmarks/metrics.py').exists():","if False:  # Aggregate metrics are computed only after all case artifacts are collected.")
          pathlib.Path('benchmarks/run_case.py').write_text(s)
          PY
          python3 benchmarks/run_case.py
      - name: Preserve case output even on failure
        if: always()
        run: |
          mkdir -p evidence/${BENCH_FAMILY}_${BENCH_SHAPE//,/_}
          cp -r benchmark-results platform benchmarks evidence/${BENCH_FAMILY}_${BENCH_SHAPE//,/_}/
          cp .github/workflows/benchmark-isolated.yml evidence/${BENCH_FAMILY}_${BENCH_SHAPE//,/_}/workflow.yml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: case-${{ matrix.family }}-${{ matrix.shape }}
          path: evidence
          retention-days: 30
  aggregate:
    needs: case
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: case-*
          path: collected
          merge-multiple: true
      - name: Collect every successful and failed case without replacing missing records
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y python3-numpy python3-scipy
          python3 - <<'PY'
          from pathlib import Path
          import json,shutil,os
          out=Path('benchmark-results');out.mkdir(exist_ok=True)
          cases=[];hosts={};missing=[]
          for fam in ['crossbar','benes','router']:
            for n,w in [(4,8),(8,8),(4,16),(8,16),(16,8),(16,16)]:
              base=Path('collected')/f'{fam}_{n}_{w}'
              src=base/'benchmark-results'
              name=f'{fam}_n{n}_w{w}'
              if (src/'cases.json').exists():
                records=json.loads((src/'cases.json').read_text())
                assert len(records)==1 and records[0]['case']==name
                cases.extend(records)
                if (src/name).exists():shutil.copytree(src/name,out/name)
              else:
                missing.append(name)
                cases.append({'case':name,'family':fam,'n':n,'w':w,'split':'calibration' if (n,w) in [(4,8),(8,8)] else 'test','status':'missing-artifact-or-watchdog','routes':[]})
              hosts[name]=(src/'host.txt').read_text() if (src/'host.txt').exists() else None
              if not Path('platform').exists() and (base/'platform').exists():shutil.copytree(base/'platform','platform')
          (out/'cases.json').write_text(json.dumps(cases,indent=2))
          (out/'case-hosts.json').write_text(json.dumps(hosts,indent=2))
          (out/'collection.json').write_text(json.dumps({'source_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'missing':missing,'cases':len(cases)},indent=2))
          PY
          (cd benchmark-results && /usr/bin/python3 ../benchmarks/metrics.py | tee metrics-console.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flash-isolated-complete-evidence
          path: |
            benchmark-results
            collected
            benchmarks
            platform
          retention-days: 30
