name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact release
        uses: actions/checkout@v4
      - name: Check full HTML integrity, aliases and JavaScript
        run: python3 tools/check_site.py
      - name: Prepare plain static site
        run: |
          set -euo pipefail
          mkdir -p _site/planner
          cp index.html _site/index.html
          cp planner.html _site/planner.html
          cp planner/index.html _site/planner/index.html
          cp pixel.html _site/intro.html
          cp pixel.html _site/pixel.html
          cp README.md build-info.json _site/
          touch _site/.nojekyll
          cmp _site/index.html _site/planner.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public root and planner HTML are the exact release
        run: python3 tools/verify_public.py
