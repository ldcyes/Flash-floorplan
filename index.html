<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flash-flooplanner Pixel v8.3</title><style>html,body{margin:0;min-height:100%;background:#06111f;color:#dff7ff;font-family:Consolas,monospace}.boot{min-height:100vh;display:grid;place-items:center}.card{border:2px solid #2b78a5;background:#0b2440;box-shadow:6px 6px 0 #03101d;padding:24px;max-width:560px}.bar{height:10px;border:2px solid #245f87;margin-top:14px}.bar i{display:block;height:100%;width:8%;background:#35e7ff;animation:p 1.2s steps(12,end) infinite}@keyframes p{to{width:100%}}</style></head><body><div class="boot"><div class="card"><b>FLASH-FLOOPLANNER PIXEL v8.3</b><div id="msg">Loading planner… / 正在载入规划器…</div><div class="bar"><i></i></div></div></div><script>(async()=>{try{const names=Array.from({length:24},(_,i)=>`site/v8.3/part-${String(i).padStart(2,'0')}.txt`);const texts=await Promise.all(names.map(async n=>{const r=await fetch(n,{cache:'no-store'});if(!r.ok)throw new Error(n+' '+r.status);return r.text()}));const bin=Uint8Array.from(atob(texts.join('')),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('msg').textContent='Load failed / 载入失败: '+e.message;console.error(e)}})();</script></body></html>
